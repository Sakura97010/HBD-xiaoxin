<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>野原新之助来电</title>
    <link rel="preload" as="image" href="./xiaoxin-avatar.jpg" fetchpriority="high">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{color:#fff;font-family:system-ui;overflow:hidden}
        .page{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;top:0;left:0;padding:20px}
        .hide{display:none!important}

        /* 来电页纯色渐变 */
        #p1{background: linear-gradient(180deg, #0F172A, #1E293B, #2E1065);}
        /* 通话页背景 */
        #p2{background:url('./call-bg.jpg') center/cover no-repeat;}
        /* 吹蜡烛页面纯色 */
        #p3{background: linear-gradient(180deg, #0F172A, #1E293B, #2E1065);}
        /* 烟花页面 使用你的GIF动图 */
        #p4{background:url('./fire-gif.gif') center/cover no-repeat;}
        /* 结尾祝福页 */
        #p6{background:url('./card-bg.jpg') center/cover no-repeat;}

        .avatar-box{position:relative;width:190px;height:190px;margin-bottom:35px;z-index:1}
        .avatar{width:100%;height:100%;border-radius:50%;background:#FFD100 url('./xiaoxin-avatar.jpg')center/cover no-repeat;box-shadow:0 0 25px #FFD10066}
        .wave{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:2px solid #FFD10066;animation:w 2s infinite}
        .wave:nth-child(3){animation-delay:.7s}
        @keyframes w{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}

        .call-title{font-size:28px;color:#FFD100;margin-bottom:8px;}
        .call-sub{font-size:15px;color:#ccc;}
        .btn-group{display:flex;gap:45px;margin-top:40px}
        .btn{width:75px;height:75px;border-radius:50%;border:none;color:#fff;font-size:15px;font-weight:500}
        .btn-accept{background:linear-gradient(135deg,#10B981,#059669)}
        .btn-refuse{background:linear-gradient(135deg,#EF4444,#DC2626)}

        .talk-time{font-size:22px;color:#FFD100;margin:10px 0}
        .talk-text{font-size:18px;max-width:300px;line-height:1.5;text-align:center}

        .cake-pic{width:220px;height:auto;margin:0 auto 25px;border-radius:12px;overflow:hidden}
        .cake-pic img{width:100%;height:auto;display:block}
        .flame{width:18px;height:28px;background:linear-gradient(180deg,#FFEF00,#FF9A00);border-radius:50% 50% 10% 10%;position:relative;top:-15px;margin:0 auto;animation:f .7s infinite alternate}
        @keyframes f{0%{transform:scale(1)}100%{transform:scale(1.1)}}
        .flame.out{opacity:0;height:0}
        .progress{width:140px;height:5px;background:#333;border-radius:2px;margin:12px auto}
        .progress-bar{height:100%;width:0%;background:#FFD100;transition:width .1s linear}
        .btn-blow{width:95px;height:95px;border-radius:50%;background:linear-gradient(135deg,#FFD100,#FFB400);border:none;font-size:17px;font-weight:500;color:#222;
            -webkit-touch-callout: none;-webkit-user-select: none;user-select: none;
        }

        .meteor{display:none;}

        /* 结尾文字 上方1/4位置 橙色无框 */
        .blessing-text{
            position:absolute;
            top:25%;
            left:50%;
            transform:translateX(-50%);
            font-size:28px;
            color:#ff9500;
            text-align:center;
            background:none !important;
            padding:0;
            border-radius:0;
            width:90%;
        }
    </style>
</head>
<body>
    <div class="page" id="p1">
        <div class="avatar-box"><div class="avatar"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="call-title">野原新之助</div>
        <div class="call-sub">生日来电中...</div>
        <div class="btn-group">
            <button class="btn btn-refuse" id="refuse">拒绝</button>
            <button class="btn btn-accept" id="accept">接听</button>
        </div>
    </div>

    <div class="page hide" id="p2">
        <div class="talk-time" id="ttime">00:00</div>
        <div class="talk-text">小新送祝福中~</div>
    </div>

    <div class="page hide" id="p3">
        <div class="cake-pic">
            <img src="./cake-img.jpg" alt="生日蛋糕">
        </div>
        <div class="flame" id="fire"></div>
        <div style="text-align:center">
            <div style="color:#FFD100;font-size:20px;margin-bottom:8px">长按3秒吹灭蜡烛</div>
            <div class="progress"><div class="progress-bar" id="bar"></div></div>
            <button class="btn-blow" id="blowBtn">长按吹灭</button>
        </div>
    </div>

    <div class="page fireworks-page hide" id="p4"></div>

    <div class="page card-page hide" id="p6">
        <div class="blessing-text" id="finalBless"></div>
    </div>

<script>
const USER_BLESS = "愿你做自由的自己，年年有今日，岁岁有今朝！";
let ringAudio = null;
let bgmAudio = null;
let blowTimer, blowProgress = 0, BLOW_TIME = 3000;
let callTimer, sec = 0;
let isBlowing = false;

function playAudio(file, callback) {
    try {
        document.querySelectorAll('audio').forEach(a => { a.pause(); a.currentTime = 0; });
        if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
        const audio = new Audio(`./${file}.mp3`);
        audio.play().then(()=>{audio.onended = callback;}).catch(()=>{callback?.()});
        return audio;
    } catch (e) { callback?.(); return null; }
}

function initRingSound(){
    ringAudio = new Audio('./ring.mp3');
    ringAudio.loop = true;
    ringAudio.volume = 0.5;
}

function playEndBGM(){
    if(bgmAudio) return;
    bgmAudio = new Audio('./bgm.mp3');
    bgmAudio.loop = true;
    bgmAudio.volume = 0.35;
    bgmAudio.play().catch(()=>{});
}

function startCallTimer() {
    sec = 0;
    callTimer = setInterval(() => {
        sec++;
        let m = String(Math.floor(sec/60)).padStart(2,'0');
        let s = String(sec%60).padStart(2,'0');
        document.getElementById('ttime').innerText = `${m}:${s}`;
    }, 1000);
}

function show(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hide'));
    document.getElementById(id).classList.remove('hide');
    if(id === 'p6') playEndBGM();
}

function startBlow() {
    if (isBlowing) return;
    isBlowing = true;
    blowProgress = 0;
    document.getElementById('bar').style.width = '0%';
    blowTimer = setInterval(() => {
        blowProgress += 100;
        let percentage = Math.min(100, (blowProgress / BLOW_TIME)*100);
        document.getElementById('bar').style.width = percentage + '%';
        if (blowProgress >= BLOW_TIME) {
            completeBlow();
        }
    }, 100);
}
function stopBlow() {
    if (isBlowing && blowProgress < BLOW_TIME) {
        clearInterval(blowTimer);
        document.getElementById('bar').style.width = '0%';
        isBlowing = false;
    }
}
function completeBlow() {
    clearInterval(blowTimer);
    isBlowing = false;
    document.getElementById('fire').classList.add('out');
    show('p4');
    playAudio('05-success', () => {
        setTimeout(() => playAudio('06-gift', () => {
            setTimeout(() => playAudio('07-end', () => {
                setTimeout(() => {
                    clearInterval(callTimer);
                    show('p6');
                    document.getElementById('finalBless').innerText = USER_BLESS;
                }, 1200);
            }));
        }), 800);
    });
}

window.onload = () => {
    initRingSound();
    const blowBtn = document.getElementById('blowBtn');
    blowBtn.addEventListener('mousedown', startBlow);
    blowBtn.addEventListener('mouseup', stopBlow);
    blowBtn.addEventListener('mouseleave', stopBlow);
    blowBtn.addEventListener('touchstart', e=>{e.preventDefault();startBlow()});
    blowBtn.addEventListener('touchend', stopBlow);
    blowBtn.addEventListener('touchcancel', stopBlow);
};

document.getElementById('accept').addEventListener('click', () => {
    ringAudio.play().catch(()=>{});
    setTimeout(() => {
        ringAudio.pause();
        show('p2');
        startCallTimer();
        playAudio('01-open', () => {
            setTimeout(() => playAudio('02-cake', () => {
                setTimeout(() => playAudio('03-blessing', () => {
                    setTimeout(() => {
                        show('p3');
                        playAudio('04-candle');
                    }, 800);
                }));
            }), 800);
        });
    }, 300);
});

document.getElementById('refuse').onclick = () => {
    alert("不接小新会伤心哦！");
};
</script>
</body>
</html>
