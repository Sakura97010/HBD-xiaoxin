<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野原新之助的生日来电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
        }
        body {
            background: linear-gradient(180deg, #0F172A, #1E293B, #2E1065);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: absolute;
            top: 0;
            left: 0;
        }
        .hide { display: none !important; }
        .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 来电界面 */
        .avatar-box {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
            z-index: 1;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: url('./xiaoxin-avatar.jpg') center/cover;
            box-shadow: 0 0 40px #FFD10088;
        }
        .wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #FFD10066;
            animation: wave 2s infinite ease-out;
        }
        .wave:nth-child(3) { animation-delay: 0.7s; }
        @keyframes wave {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .call-title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #FFD100;
            text-shadow: 0 0 10px #FFD10066;
        }
        .call-sub { font-size: 16px; color: #ccc; }
        .btn-group { display: flex; gap: 50px; margin-top: 50px; z-index: 1; }
        .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-accept { background: linear-gradient(135deg, #10B981, #059669); }
        .btn-refuse { background: linear-gradient(135deg, #EF4444, #DC2626); }

        /* 通话界面 */
        .talk-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: url('./xiaoxin-avatar.jpg') center/cover;
            margin: 0 auto 20px;
        }
        .talk-time { font-size: 24px; margin: 15px 0; color: #FFD100; }
        .talk-text { font-size: 20px; max-width: 320px; line-height: 1.6; }

        /* 吹蜡烛 */
        .cake {
            width: 200px;
            height: 140px;
            background: linear-gradient(180deg, #FFE4E4, #FFD6D6);
            border-radius: 15px;
            margin: 0 auto 30px;
            position: relative;
        }
        .cake-top {
            width: 160px;
            height: 20px;
            background: #FFA0A0;
            border-radius: 8px;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
        }
        .candle {
            width: 14px;
            height: 60px;
            background: #fff;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
        }
        .flame {
            width: 20px;
            height: 30px;
            background: linear-gradient(180deg, #FFEF00, #FF9A00);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            animation: flame 0.7s infinite alternate;
        }
        @keyframes flame {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.15); }
        }
        .flame.out { opacity: 0; height: 0; }
        .progress { width: 150px; height: 6px; background: #333; margin: 15px auto; border-radius: 3px; }
        .progress-bar { height: 100%; width: 0%; background: #FFD100; transition: width 0.1s linear; }
        .btn-blow {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD100, #FFB400);
            border: none;
            font-size: 18px;
            font-weight: bold;
        }

        /* 烟花流星 */
        .fireworks-page { background: #000; }
        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explode 1.5s forwards;
        }
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(10); opacity: 0; }
        }
        .meteor {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD100, #fff);
            transform: rotate(-45deg);
            left: -150px;
            opacity: 0;
        }
        .meteor.fly {
            animation: fly 2.2s forwards;
        }
        @keyframes fly {
            0% { left: -150px; opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* 结尾祝福 */
        .card-page { background: url('./card-bg.jpg') center/cover; }
        .blessing-text {
            font-size: 28px;
            color: #fff;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 12px;
            z-index: 1;
        }
    </style>
</head>
<body>

<!-- 1 来电 -->
<div class="page" id="p1">
    <div class="avatar-box">
        <div class="avatar"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    <div class="call-title">野原新之助</div>
    <div class="call-sub">生日来电中...</div>
    <div class="btn-group">
        <button class="btn btn-refuse" id="refuse">拒绝</button>
        <button class="btn btn-accept" id="accept">接听</button>
    </div>
</div>

<!-- 2 通话 -->
<div class="page hide" id="p2">
    <div class="talk-avatar"></div>
    <div class="talk-time" id="ttime">00:00</div>
    <div class="talk-text">小新正在送你祝福~</div>
</div>

<!-- 3 吹蜡烛 -->
<div class="page hide" id="p3">
    <div class="cake">
        <div class="cake-top"></div>
        <div class="candle"><div class="flame" id="fire"></div></div>
    </div>
    <div style="text-align:center">
        <div class="blow-title" style="color:#FFD100;font-size:22px;margin-bottom:10px">长按3秒吹灭蜡烛</div>
        <div class="progress"><div class="progress-bar" id="bar"></div></div>
        <button class="btn-blow" onmousedown="startBlow()" onmouseup="stopBlow()" ontouchstart="startBlow()" ontouchend="stopBlow()">长按吹灭</button>
    </div>
</div>

<!-- 4 烟花流星 -->
<div class="page fireworks-page hide" id="p4">
    <div class="meteor" id="meteor"></div>
</div>

<!-- 5 礼物 -->
<div class="page hide" id="p5"></div>

<!-- 6 结束 -->
<div class="page card-page hide" id="p6">
    <div class="blessing-text" id="finalBless"></div>
</div>

<script>
// ====================== 自定义配置 ======================
const USER_BLESS = "愿你做自由的自己，年年有今日，岁岁有今朝！"; // 你的祝福语
// ======================================================

let blowTimer, blowProgress=0;
const BLOW_TIME = 3000;
let callTimer, sec=0;

// 音频播放核心配置（已写好GitHub路径）
function playAudio(file, callback) {
    stopAllAudio();
    const audio = new Audio(`./${file}.mp3`);
    audio.play();
    audio.onended = callback;
    return audio;
}

function stopAllAudio() {
    document.querySelectorAll('audio').forEach(a => {
        a.pause();
        a.currentTime = 0;
    });
}

// 计时
function startCallTimer() {
    sec=0;
    callTimer = setInterval(()=>{
        sec++;
        let m = String(Math.floor(sec/60)).padStart(2,'0');
        let s = String(sec%60).padStart(2,'0');
        document.getElementById('ttime').innerText = `${m}:${s}`;
    },1000);
}

// 切换页面
function show(id) {
    document.querySelectorAll('.page').forEach(p=>p.classList.add('hide'));
    document.getElementById(id).classList.remove('hide');
}

// 烟花
function createFireworks() {
    const colors = ['#FFD100','#FF6B6B','#4ECDC4','#FF9A00','#fff'];
    let box = document.getElementById('p4');
    box.innerHTML = '<div class="meteor" id="meteor"></div>';
    for(let i=0;i<40;i++){
        let f = document.createElement('div');
        f.className = 'firework';
        f.style.left = Math.random()*100+'%';
        f.style.top = Math.random()*100+'%';
        f.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        f.style.animationDelay = Math.random()+'s';
        box.appendChild(f);
    }
    document.getElementById('meteor').classList.add('fly');
}

// 接听
document.getElementById('accept').onclick = ()=>{
    show('p2');
    startCallTimer();
    playAudio('01-open',()=>{
        setTimeout(()=>{
            playAudio('02-cake',()=>{
                setTimeout(()=>{
                    playAudio('03-blessing',()=>{
                        setTimeout(()=>{
                            show('p3');
                            playAudio('04-candle',()=>{});
                        },1000);
                    });
                },1000);
            });
        },1000);
    });
};

// 拒绝
document.getElementById('refuse').onclick = ()=>{
    alert("不接小新电话会伤心的！");
};

// 吹蜡烛
function startBlow(){
    if(blowTimer) return;
    blowProgress=0;
    document.getElementById('bar').style.width='0%';
    blowTimer = setInterval(()=>{
        blowProgress += 100;
        let per = Math.min(100, (blowProgress/BLOW_TIME)*100);
        document.getElementById('bar').style.width = per+'%';
        if(blowProgress >= BLOW_TIME){
            clearInterval(blowTimer);
            document.getElementById('fire').classList.add('out');
            show('p4');
            createFireworks();
            playAudio('05-success',()=>{
                setTimeout(()=>{
                    playAudio('06-gift',()=>{
                        setTimeout(()=>{
                            playAudio('07-end',()=>{
                                setTimeout(()=>{
                                    clearInterval(callTimer);
                                    show('p6');
                                    document.getElementById('finalBless').innerText = USER_BLESS;
                                },1500);
                            });
                        },1000);
                    });
                },2000);
            });
        }
    },100);
}

function stopBlow(){
    if(blowProgress < BLOW_TIME){
        clearInterval(blowTimer);
        document.getElementById('bar').style.width='0%';
    }
}
</script>
</body>
</html>
