<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>野原新之助来电</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{background:#0F172A;font-family:system-ui;overflow:hidden}
        .page{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;top:0;left:0;padding:20px}
        .hide{display:none!important}

        /* 来电页纯色渐变 */
        #p1{background:linear-gradient(180deg,#0F172A,#1E293B,#2E1065)}
        /* 通话页背景 + 头像 */
        #p2{background:url('./call-bg.jpg') center/cover no-repeat}
        /* 吹蜡烛页 */
        #p3{background:linear-gradient(180deg,#0F172A,#1E293B,#2E1065)}
        /* 烟花页背景 */
        #p4{background:url('./call-bg.jpg') center/cover no-repeat}
        /* 祝福页背景 */
        #p6{background:url('./card-bg.jpg') center/cover no-repeat}

        .avatar-box{position:relative;width:170px;height:170px;margin-bottom:30px;z-index:1}
        .avatar{width:100%;height:100%;border-radius:50%;background:#FFD100 url('./xiaoxin-avatar.jpg')center/cover no-repeat;box-shadow:0 0 20px rgba(255,209,0,0.5)}
        .wave{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:2px solid rgba(255,209,0,0.6);animation:waveAnim 2s infinite}
        .wave:nth-child(3){animation-delay:0.7s}
        @keyframes waveAnim{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}

        .call-title{font-size:28px;color:#FFD100;font-weight:600;margin-bottom:6px}
        .call-sub{font-size:15px;color:#ccc}
        .btn-group{display:flex;gap:45px;margin-top:40px}
        .btn{width:75px;height:75px;border-radius:50%;border:none;color:#fff;font-size:15px;font-weight:500}
        .btn-accept{background:linear-gradient(135deg,#10B981,#059669)}
        .btn-refuse{background:linear-gradient(135deg,#EF4444,#DC2626)}

        /* 通话页：恢复头像 */
        .talk-avatar{width:120px;height:120px;border-radius:50%;background:#FFD100 url('./xiaoxin-avatar.jpg')center/cover no-repeat;margin:0 auto 15px;box-shadow:0 0 15px rgba(255,209,0,0.5)}
        .talk-time{font-size:28px;color:#FFD100;margin-bottom:12px}
        .talk-text{font-size:18px;padding:8px 20px;border-radius:60px}

        .cake-pic{width:220px;margin-bottom:20px;border-radius:24px;overflow:hidden}
        .cake-pic img{width:100%;display:block}
        .flame{width:20px;height:32px;background:radial-gradient(circle,#FFEF00,#FF9A00);border-radius:50% 50% 20% 20%;margin:-10px auto 5px;animation:flicker 0.6s infinite alternate}
        @keyframes flicker{0%{transform:scale(1);opacity:0.9}100%{transform:scale(1.1);opacity:1}}
        .flame.out{opacity:0;height:0}
        .progress{width:160px;height:6px;background:#334155;border-radius:10px;margin:12px auto}
        .progress-bar{width:0%;height:100%;background:#FFD100;border-radius:10px;transition:width 0.05s linear}
        .btn-blow{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#FFD100,#FFB400);border:none;font-weight:bold;font-size:17px;color:#2D1B00;touch-action:manipulation}

        .meteor{display:none}

        /* 祝福文字：页面1/4位置，橙色无边框 */
        .blessing-text{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:86%;font-size:26px;font-weight:600;color:#FF9F2E;text-align:center;background:none;line-height:1.4}
    </style>
</head>
<body>
    <!-- 来电页 -->
    <div class="page" id="p1">
        <div class="avatar-box"><div class="avatar"></div><div class="wave"></div><div class="wave"></div></div>
        <div class="call-title">野原新之助</div>
        <div class="call-sub">🎂 生日来电中 🎂</div>
        <div class="btn-group">
            <button class="btn btn-refuse" id="refuse">拒绝</button>
            <button class="btn btn-accept" id="accept">接听</button>
        </div>
    </div>

    <!-- 通话页（已恢复头像） -->
    <div class="page hide" id="p2">
        <div class="talk-avatar"></div>
        <div class="talk-time" id="ttime">00:00</div>
        <div class="talk-text">✨ 小新正在送祝福 ✨</div>
    </div>

    <!-- 吹蜡烛页 -->
    <div class="page hide" id="p3">
        <div class="cake-pic"><img id="cakeImg" src="./cake-img.jpg" alt="生日蛋糕"></div>
        <div class="flame" id="fire"></div>
        <div style="text-align:center">
            <div style="color:#FFD100; margin-bottom:8px;">🎂 长按3秒吹灭蜡烛 🎂</div>
            <div class="progress"><div class="progress-bar" id="bar"></div></div>
            <button class="btn-blow" id="blowBtn">💨 长按吹灭</button>
        </div>
    </div>

    <!-- 烟花页 -->
    <div class="page hide" id="p4"></div>

    <!-- 祝福页 -->
    <div class="page hide" id="p6">
        <div class="blessing-text" id="finalBless"></div>
    </div>

<script>
const USER_BLESS = "✨ 愿你做自由的自己，年年有今日，岁岁有今朝！✨";
let ringAudio = null;
let bgmAudio = null;
let currentAudio = null;
let blowTimer = null, blowProgress = 0, isBlowing = false;
let callTimer = null, sec = 0;

// 稳定音频播放（回调模式，绝不跳过）
function playAudio(file, callback) {
    stopAllAudio();
    currentAudio = new Audio(`./${file}.mp3`);
    currentAudio.volume = 0.4;
    currentAudio.play().catch(() => {
        callback();
    });
    currentAudio.onended = callback;
    currentAudio.onerror = callback;
}

// 停止所有声音
function stopAllAudio() {
    if (ringAudio) { ringAudio.pause(); ringAudio.currentTime = 0; }
    if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; }
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
}

// 播放来电铃声
function playRing() {
    ringAudio = new Audio('./ring.mp3');
    ringAudio.loop = true;
    ringAudio.volume = 0.4;
    ringAudio.play().catch(() => {});
}

// 播放结尾BGM
function playBGM() {
    bgmAudio = new Audio('./bgm.mp3');
    bgmAudio.loop = true;
    bgmAudio.volume = 0.35;
    bgmAudio.play().catch(() => {});
}

// 通话计时
function startCallTimer() {
    sec = 0;
    callTimer = setInterval(() => {
        sec++;
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById("ttime").innerText = `${m}:${s}`;
    }, 1000);
}

// 页面切换
function show(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hide'));
    document.getElementById(id).classList.remove('hide');
    if (id === 'p6') playBGM();
}

// 接听逻辑：严格按顺序播放，绝不跳转
document.getElementById('accept').onclick = () => {
    // 1. 播放来电铃声
    playRing();
    setTimeout(() => {
        // 2. 停铃声，切通话页面
        ringAudio.pause();
        show('p2');
        startCallTimer();

        // 3. 顺序播放语音：01 → 02 → 03 → 吹蜡烛页
        playAudio('01-open', () => {
            setTimeout(() => {
                playAudio('02-cake', () => {
                    setTimeout(() => {
                        playAudio('03-blessing', () => {
                            setTimeout(() => {
                                show('p3');
                                playAudio('04-candle', () => {});
                            }, 800);
                        });
                    }, 800);
                });
            }, 800);
        });
    }, 500);
};

// 拒绝
document.getElementById('refuse').onclick = () => {
    alert("📞 不接小新会伤心的哦～");
};

// 长按吹蜡烛
function startBlow() {
    if (isBlowing) return;
    isBlowing = true;
    blowProgress = 0;
    const bar = document.getElementById("bar");
    bar.style.width = "0%";
    clearInterval(blowTimer);

    blowTimer = setInterval(() => {
        blowProgress += 100;
        const p = Math.min(100, (blowProgress / 3000) * 100);
        bar.style.width = p + "%";

        if (blowProgress >= 3000) {
            clearInterval(blowTimer);
            isBlowing = false;
            document.getElementById("fire").classList.add("out");
            show('p4');

            playAudio('05-success', () => {
                setTimeout(() => {
                    playAudio('06-gift', () => {
                        setTimeout(() => {
                            playAudio('07-end', () => {
                                setTimeout(() => {
                                    clearInterval(callTimer);
                                    show('p6');
                                    document.getElementById("finalBless").innerText = USER_BLESS;
                                }, 1200);
                            });
                        }, 800);
                    });
                }, 800);
            });
        }
    }, 100);
}

function stopBlow() {
    if (isBlowing && blowProgress < 3000) {
        clearInterval(blowTimer);
        document.getElementById("bar").style.width = "0%";
        isBlowing = false;
    }
}

// 绑定长按事件
const btn = document.getElementById("blowBtn");
btn.addEventListener("mousedown", startBlow);
btn.addEventListener("mouseup", stopBlow);
btn.addEventListener("mouseleave", stopBlow);
btn.addEventListener("touchstart", (e) => { e.preventDefault(); startBlow(); });
btn.addEventListener("touchend", stopBlow);
btn.addEventListener("touchcancel", stopBlow);
</script>
</body>
</html>
