<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法蜡笔小新生日来电</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
        body{background:linear-gradient(180deg,#0F172A,#1E293B,#2E1065);color:#fff;min-height:100vh;overflow:hidden}
        .page{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;position:absolute;top:0;left:0}
        .hide{display:none!important}

        /* 来电界面 */
        .call-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1IiBoZWlnaHQ9IjUiPgo8cmVjdCB3aWR0aD0iNSIgaGVpZ2h0PSI1IiBmaWxsPSIjMEYxNzJBIj48L3JlY3Q+CjxwYXRoIGQ9Ik0wIDVMNSAwWk02IDFMNCAzTTAgNkw1IDFaIiBzdHJva2U9IzJFMjkzQiIgc3Ryb2tlLXdpZHRoPSIwLjUiPjwvcGF0aD4KPC9zdmc+');opacity:0.3;z-index:0}
        .avatar-box{position:relative;width:200px;height:200px;margin-bottom:40px;z-index:1}
        .avatar{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#FFD100,#FFB400);display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:0 0 40px #FFD10088}
        .wave{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:3px solid #FFD10066;animation:w 2s infinite ease-out}
        .wave:nth-child(3){animation-delay:0.7s}
        @keyframes w{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
        .call-title{font-size:30px;font-weight:bold;margin-bottom:12px;color:#FFD100;text-shadow:0 0 10px #FFD10066}
        .call-sub{font-size:16px;color:#ccc}
        .btn-group{display:flex;gap:50px;margin-top:50px;z-index:1}
        .btn{width:80px;height:80px;border-radius:50%;border:none;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 20px #00000033}
        .btn:active{transform:scale(0.92)}
        .btn-accept{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 8px 25px #10B98144}
        .btn-refuse{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 8px 25px #EF444444}

        /* 通话界面 */
        .talk-box{z-index:1;text-align:center}
        .talk-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#FFD100,#FFB400);display:flex;align-items:center;justify-content:center;font-size:60px;margin:0 auto 20px;box-shadow:0 0 30px #FFD10066}
        .talk-time{font-size:24px;margin:15px 0;color:#FFD100;font-weight:bold}
        .talk-text{font-size:20px;color:#eee;max-width:320px;line-height:1.6}

        /* 吹蜡烛界面（长按3秒） */
        .cake-box{position:relative;z-index:1;text-align:center}
        .cake{width:200px;height:140px;background:linear-gradient(180deg,#FFE4E4,#FFD6D6);border-radius:15px;position:relative;margin:0 auto 30px;box-shadow:0 10px 30px #00000022}
        .cake-top{width:160px;height:20px;background:#FFA0A0;border-radius:8px;position:absolute;top:-10px;left:50%;transform:translateX(-50%)}
        .candle{width:14px;height:60px;background:#fff;position:absolute;top:-50px;left:50%;transform:translateX(-50%);border-radius:4px}
        .flame{width:20px;height:30px;background:linear-gradient(180deg,#FFEF00,#FF9A00,#FF5500);border-radius:50% 50% 20% 20%;position:absolute;top:-30px;left:50%;transform:translateX(-50%);animation:f 0.7s infinite alternate;box-shadow:0 0 20px #FF9A00}
        @keyframes f{0%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(1.15);opacity:0.9}}
        .flame.out{height:0;opacity:0}
        .blow-title{font-size:22px;color:#FFD100;margin-bottom:15px;font-weight:bold}
        .blow-tip{font-size:14px;color:#ccc;margin-bottom:20px}
        .btn-blow{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#FFD100,#FFB400);color:#111;font-size:18px;font-weight:bold;border:none;box-shadow:0 10px 30px #FFD10044}
        .progress{width:150px;height:6px;background:#333;border-radius:3px;margin:15px auto;overflow:hidden}
        .progress-bar{height:100%;width:0%;background:#FFD100;transition:width 0.1s linear}

        /* 许愿流星界面 */
        .sky{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 20%,rgba(255,209,0,0.1),transparent),radial-gradient(circle at 80% 80%,rgba(255,85,0,0.1),transparent);z-index:0}
        .wish-title{font-size:24px;color:#FFD100;margin-bottom:25px;font-weight:bold;text-shadow:0 0 10px #FFD10033}
        .wish-input{padding:14px 20px;border-radius:12px;border:none;width:280px;margin:0 auto 25px;background:#1E293B;color:#fff;font-size:16px;outline:none;border:2px solid #FFD10033}
        .wish-input:focus{border-color:#FFD100}
        .btn-wish{padding:14px 30px;border-radius:12px;background:linear-gradient(135deg,#FFD100,#FFB400);color:#111;font-size:17px;font-weight:bold;border:none;box-shadow:0 8px 20px #FFD10033}
        .meteor{position:absolute;width:150px;height:2px;background:linear-gradient(90deg,transparent,#FFD100,#fff);transform:rotate(-45deg);left:-150px;top:45%;opacity:0;z-index:2}
        .meteor.fly{animation:m 2.2s forwards cubic-bezier(0.22,1,0.36,1)}
        @keyframes m{0%{left:-150px;top:45%;opacity:1}100%{left:100%;top:10%;opacity:0}}

        /* 挂断界面 */
        .end-title{font-size:28px;color:#FFD100;margin-bottom:20px;font-weight:bold}
        .end-time{font-size:22px;color:#ccc}

        /* 祝福卡片 */
        .card{background:linear-gradient(135deg,#4F46E5,#7C3AED,#DB2777);padding:50px 35px;border-radius:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);position:relative;overflow:hidden;z-index:1;border:2px solid #FFD10022}
        .card::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2IiBoZWlnaHQ9IjYiPjxwYXRoIGQ9Ik0wIDBMNiA2TTAgNkw2IDBaIiBzdHJva2U9I2ZmZmYwMCAgc3Ryb2tlLXdpZHRoPSIwLjQiIG9wYWNpdHk9IjAuMSI+PC9wYXRoPjwvc3ZnPg==');z-index:0}
        .card h2{color:#FFD100;font-size:32px;margin-bottom:25px;font-weight:bold;text-shadow:0 0 15px #FFD10022;position:relative;z-index:1}
        .card-name{font-size:22px;color:#fff;margin-bottom:15px;position:relative;z-index:1}
        .card-bless{font-size:18px;color:#eee;line-height:1.7;margin-bottom:35px;position:relative;z-index:1}
        .card-sign{font-size:16px;color:#FFD100;font-weight:bold;position:relative;z-index:1}
    </style>
</head>

<body>
    <!-- 来电 -->
    <div class="page" id="p1">
        <div class="call-bg"></div>
        <div class="avatar-box">
            <div class="avatar">👶</div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        <div class="call-title">魔法蜡笔小新</div>
        <div class="call-sub">魔法生日来电中...</div>
        <div class="btn-group">
            <button class="btn btn-refuse" id="refuse">拒绝</button>
            <button class="btn btn-accept" id="accept">接听</button>
        </div>
    </div>

    <!-- 通话 -->
    <div class="page hide" id="p2">
        <div class="talk-box">
            <div class="talk-avatar">👶</div>
            <div class="talk-time" id="ttime">00:00</div>
            <div class="talk-text">小新正在送你魔法祝福～</div>
        </div>
    </div>

    <!-- 吹蜡烛（长按3秒） -->
    <div class="page hide" id="p3">
        <div class="cake-box">
            <div class="cake">
                <div class="cake-top"></div>
                <div class="candle">
                    <div class="flame" id="fire"></div>
                </div>
            </div>
            <div class="blow-title">长按3秒吹灭蜡烛</div>
            <div class="blow-tip">按住按钮不要松手哦～</div>
            <div class="progress">
                <div class="progress-bar" id="bar"></div>
            </div>
            <button class="btn btn-blow" id="blow" onmousedown="startBlow()" onmouseup="stopBlow()" ontouchstart="startBlow()" ontouchend="stopBlow()">长按吹灭</button>
        </div>
    </div>

    <!-- 许愿 -->
    <div class="page hide" id="p4">
        <div class="sky"></div>
        <div class="wish-title">✨ 许下你的生日愿望 ✨</div>
        <input class="wish-input" id="wish" placeholder="输入你的愿望...">
        <button class="btn btn-wish" id="sendWish">发射愿望 →</button>
        <div class="meteor" id="meteor"></div>
    </div>

    <!-- 挂断 -->
    <div class="page hide" id="p5">
        <div class="end-title">通话结束</div>
        <div class="end-time">时长：<span id="etime">00:00</span></div>
    </div>

    <!-- 祝福卡片 -->
    <div class="page hide" id="p6">
        <div class="card">
            <h2>生日快乐 🎂</h2>
            <p class="card-name" id="cname"></p>
            <p class="card-bless" id="cbless"></p>
            <p class="card-sign">—— 魔法蜡笔小新 & 神秘好朋友</p>
        </div>
    </div>

<script>
// ====================== 仅修改这里 ======================
const USER_NAME = "孙师傅"       // 寿星名字
const USER_BLESS = "生日快乐，愿你永远做自己想做的事情，年年有今日，岁岁有今朝！" // 你的祝福语
// ======================================================

// 严格按照你需求文档的固定台词，一字未改
const LINES = {
    open: "喎～喎～喎～你好呀！我是魔法师蜡笔小新！现在要试试我的新魔法，你是不是那个今天过生日的幸运儿呀？是还是不是呀？",
    confirm: "哦～太好了！我接受了一位神秘好朋友的魔法委托，专门来给你送生日魔法祝福！还有特别的蛋糕哦！你准备好了吗？",
    blessing: `那个神秘好朋友还让我带了一句话给你，他说——${USER_BLESS}！`,
    candle: "来来来，对着你的手机吹气！把蜡烛吹灭，我的魔法才能实现哦！一、二、三，开始！",
    success: "生日快乐！魔法实现了！现在许个愿吧，这个流星会带走你的愿望哦！",
    gift: "对了对了！小新差点忘了一件超级重要的事！那个神秘好朋友还托小新带了一个礼物给你哦！不过嘛……礼物现在还在小新家，因为小新找不到地方放了……总之过两天会送到的啦！是很厉害的礼物哦！比小新的蜡笔还要厉害！啊不对,没有比蜡笔更厉害的东西……总之你等着吧！",
    end: "嗯嗯～你的愿望已经飞向星空了！神秘好朋友会帮你实现的！我要挂电话了，记得给我留蛋糕哦！拜拜！"
}

let cur = 1
let refuse = 0
let timer, sec=0
let blowTimer = null
let blowProgress = 0
const BLOW_TIME = 3000

// 语音播放
function speak(text){
    window.speechSynthesis.cancel()
    let u = new SpeechSynthesisUtterance(text)
    u.rate = 0.85
    u.pitch = 1.6
    u.volume = 1
    u.lang = "zh-CN"
    window.speechSynthesis.speak(u)
    return u
}

// 通话计时
function startTimer(){
    sec=0
    timer = setInterval(()=>{
        sec++
        let m = String(Math.floor(sec/60)).padStart(2,"0")
        let s = String(sec%60).padStart(2,"0")
        document.getElementById("ttime").innerText = `${m}:${s}`
    },1000)
}

// 切换页面
function show(n){
    document.querySelectorAll(".page").forEach(p=>p.classList.add("hide"))
    document.getElementById("p"+n).classList.remove("hide")
    cur=n
}

// 接听来电
document.getElementById("accept").onclick = ()=>{
    show(2)
    startTimer()
    let u1 = speak(LINES.open)
    u1.onend = ()=>{
        setTimeout(()=>{
            let u2 = speak(LINES.confirm)
            u2.onend = ()=>{
                setTimeout(()=>{
                    let u3 = speak(LINES.blessing)
                    u3.onend = ()=>{
                        setTimeout(()=>{
                            show(3)
                            speak(LINES.candle)
                        },1000)
                    }
                },1000)
            }
        },1000)
    }
}

// 拒绝来电
document.getElementById("refuse").onclick = ()=>{
    refuse++
    if(refuse>=2) document.getElementById("accept").click()
    else alert("不接我电话？！")
}

// 长按3秒吹蜡烛
function startBlow(){
    if(blowTimer) return
    blowProgress = 0
    document.getElementById("bar").style.width = "0%"
    blowTimer = setInterval(()=>{
        blowProgress += 100
        let per = Math.min(100, (blowProgress / BLOW_TIME)*100)
        document.getElementById("bar").style.width = per + "%"
        if(blowProgress >= BLOW_TIME){
            clearInterval(blowTimer)
            blowTimer = null
            document.getElementById("fire").classList.add("out")
            let u = speak(LINES.success)
            u.onend = ()=>{
                setTimeout(()=>{
                    let u2 = speak(LINES.gift)
                    u2.onend = ()=>{
                        setTimeout(()=>show(4),1500)
                    }
                },1000)
            }
        }
    },100)
}

function stopBlow(){
    if(blowProgress < BLOW_TIME){
        clearInterval(blowTimer)
        blowTimer = null
        document.getElementById("bar").style.width = "0%"
    }
}

// 发射愿望
document.getElementById("sendWish").onclick = ()=>{
    document.getElementById("meteor").classList.add("fly")
    let u = speak(LINES.end)
    u.onend = ()=>{
        setTimeout(()=>{
            clearInterval(timer)
            show(5)
            let m=String(Math.floor(sec/60)).padStart(2,"0")
            let s=String(sec%60).padStart(2,"0")
            document.getElementById("etime").innerText = `${m}:${s}`
            setTimeout(()=>show(6),2200)
        },1000)
    }
}

// 初始化卡片
window.onload=()=>{
    document.getElementById("cname").innerText = `亲爱的 ${USER_NAME}`
    document.getElementById("cbless").innerText = USER_BLESS
}
</script>
</body>
</html>
